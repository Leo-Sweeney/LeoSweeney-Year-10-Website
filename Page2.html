<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>You Have Defeated The Cheese!</h1>

    <h2 id="mouseothertext" >But At What Cost?</h2>

    <button id="mousebutton" onclick="showMouseImage()" class="normalbutton">
        Learn The Consequences Of Your Actions...
    </button>

    <img id="mouseimage" style="display: none" src="Mouse_in_snow.jpg" alt="Mouse In The Snow">
    <h6 id="mouseimagetext" style="display: none" >Alex Kard - Wikimedia Commons - CC0 1.0</h6>

    <script>
        function showMouseImage(){
            document.getElementById("mouseimage").style.display = "block";
            document.getElementById("mouseimagetext").style.display = "block";
            document.getElementById("mousebutton").style.display = "none";
            document.getElementById("mouseothertext").textContent = "This is [name of mouse]... And you just destroyed his only source of food."
        }
    </script>

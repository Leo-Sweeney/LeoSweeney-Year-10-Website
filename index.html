<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheese Simulator</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <h1>Cheese Simulator 1.0</h1>

    <h2>
        How To Play
    </h2>

    <p>
        You have encountered some cheese... You must attack and defeat it!
    </p>

    <img src="Cheese.jpg" alt="Image Of Cheese">
    <h6>Ashish5513 - Wikimedia Commons - CC BY-SA 4.0</h6>

    <br>

    <h2>Cheese Health Bar</h2>

    <div class="progress">
        <div class="progress__fill"></div>
        <div class="spanProgress__text">0%</div>
    </div>
    <button onclick="attack()" class="attackbutton">Attack</button>

    <script>
        function updateProgressBar(progressBar, value) {
            progressBar.querySelector(".progress__fill").style.width `${value}%`;
            progressBar.querySelector(".progress__text").textContent `${value}%`;
            const progressBar = document.querySelector(".progress");
            updateProgressBar(progressBar, 29);
        }
    </script>

    <br>
    <br>
    <br>
    <br>

    <a href="Page2.html">
        <button class="lorebutton">Click To Learn The Lore...</button>
    </a>
</body>
</html>
